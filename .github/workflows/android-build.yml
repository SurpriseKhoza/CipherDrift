name: CipherDrift Android APK + OBB

on:
  workflow_dispatch:
  push:
    branches: [main, development]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.0f1
          targetPlatform: Android
          buildMethod: CipherDrift.Editor.BuildAutomation.BuildEntrypoint.BuildAndroid
          allowDirtyBuild: false

      - name: Locate and verify APK / OBB outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find . -type f \( -name '*.apk' -o -name '*.obb' \) -print
          apk="$(find . -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          cp "$apk" release/
          obb="$(find . -type f -name '*.obb' -print -quit || true)"
          if [ -n "$obb" ]; then
            cp "$obb" release/
          else
            echo "::error::APK built but no OBB was found. Check Unity expansion-file settings and editor output."
            exit 1
          fi
          (cd release && sha256sum *.apk *.obb > SHA256SUMS)
          ls -lh release/

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CipherDrift-Android-APK-OBB
          path: release/*
          if-no-files-found: error
